name: RaidenBuyu
version: 1.0.0
main: com.raiden.buyu.BuyuPlugin
api-version: '1.21'
author: Raiden Technology
description: Kuralları RaidenScript ile yazılmış özel büyü masası.

commands:
  buyu:
    description: Büyü masasını açar. '/buyu yenile' kuralları yeniden yükler.
    usage: /buyu [yenile]
    aliases: [buyumasasi, enchant2]

permissions:
  raiden.buyu.kullan:
    description: Büyü masasını açabilir.
    default: true
  raiden.buyu.yonet:
    description: '/buyu yenile kullanabilir.'
    default: op
